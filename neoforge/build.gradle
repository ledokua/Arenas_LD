plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    // Forgified Fabric API - provides the Fabric API surface the common module
    // is written against.
    modImplementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:${rootProject.ffapi_version}"

    modImplementation "io.wispforest:owo-lib-neoforge:${rootProject.owo_neoforge_version}"
    // owo's companion libraries are jar-in-jar'd into the Fabric artifact but the
    // NeoForge artifact declares them as plain maven deps; the dev runtime needs
    // them on the game classpath explicitly.
    forgeRuntimeLibrary "io.wispforest:endec:0.1.8"
    forgeRuntimeLibrary "io.wispforest.endec:netty:0.1.4"
    forgeRuntimeLibrary "io.wispforest.endec:gson:0.1.5"
    forgeRuntimeLibrary "io.wispforest.endec:jankson:0.1.5"
    forgeRuntimeLibrary "blue.endless:jankson:1.2.2"

    // Local jars for dev runtime only (multiloader BusyLib's NeoForge build)
    modLocalRuntime fileTree(
            dir: "${rootProject.projectDir}/libs",
            include: ["BusyLib-neoforge-*.jar"],
            exclude: ["*sources.jar"]
    )

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${rootProject.archives_base_name}" }
    }
}
