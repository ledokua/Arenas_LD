// NeoForge glue: @Mod entrypoint, the ArenasPlatform service, and the drains that wire the common
// code's recorded packets (ArenasNetwork) and event listeners (ArenasEvents) into NeoForge.
plugins {
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${rootProject.archives_base_name}-neoforge"
}

def commonSourceSet = project(':common').sourceSets.main

neoForge {
    version = rootProject.neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
        }
        // Headless smoke test of the platform layer (./gradlew :neoforge:runGameTestServer).
        // Loads the empty template from run-gametest/gameteststructures; no EULA needed.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'arenas_ld'
        }
    }

    mods {
        arenas_ld {
            sourceSet sourceSets.main
            sourceSet commonSourceSet
        }
    }
}

dependencies {
    compileOnly project(path: ':common', configuration: 'namedElements')

    // VectorLib canvas UI (replaces owo-lib). Dev runtime classpath (FML finds mod
    // jars on it) + jar-in-jar for the release jar.
    jarJar(implementation("net.ledok:VectorLib-neoforge:${rootProject.vectorlib_version}"))

    // Local jars for dev runtime only (multiloader BusyLib's NeoForge build)
    runtimeOnly fileTree(
            dir: "${rootProject.projectDir}/libs",
            include: ["BusyLib-neoforge-*.jar"],
            exclude: ["*sources.jar"]
    )
}

processResources {
    from commonSourceSet.resources

    inputs.property 'version', project.version
    filteringCharset 'UTF-8'

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

jar {
    from commonSourceSet.output.classesDirs
    from(rootProject.file('LICENSE.txt')) {
        rename { "${it}_${rootProject.archives_base_name}" }
    }
}

sourcesJar {
    from commonSourceSet.allSource
}
