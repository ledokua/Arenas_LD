// Loader-agnostic code, written against vanilla (Mojmap) and VectorLib-common only.
// Loader APIs are reached through net.ledok.arenas_ld.platform (ArenasPlatform service,
// ArenasNetwork, ArenasEvents), implemented by the fabric and neoforge modules. Fabric API
// is deliberately NOT on this classpath, so a direct use fails to compile.
plugins {
    id 'fabric-loom'
}

base {
    archivesName = "${rootProject.archives_base_name}-common"
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()
    // Only for the Mixin annotations the common mixins compile against.
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"

    // VectorLib canvas UI (replaces owo-lib). The common artifact is the unremapped
    // Mojmap jar, matching this module's mappings; each loader module bundles the
    // matching loader jar, so compileOnly is enough here.
    compileOnly "net.ledok:VectorLib-common:${rootProject.vectorlib_version}"

    // Puffish Skills compat (reflection-free direct API use, compile only)
    modCompileOnly("net.puffish:skillsmod:0.16.5+1.21:fabric")

    // LuckPerms meta for end-of-run reward perks (optional; LuckPermsCompat guards every call,
    // and its NeoForge build exposes the same API, so the common compat covers both loaders).
    compileOnly "net.luckperms:api:5.4"

    // BusyLib is accessed via reflection at runtime (BusyStateCompat); the only
    // compile-time use is the BusyReasons.IN_DUNGEON constant, which javac inlines.
    modCompileOnly fileTree(
            dir: "${rootProject.projectDir}/libs",
            include: ["BusyLib-fabric-*.jar"],
            exclude: ["*sources.jar"]
    )

    // JUnit 5 for unit tests
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

loom {
    accessWidenerPath = file("src/main/resources/arenas_ld.accesswidener")
    runs {
        client { ideConfigGenerated = false }
        server { ideConfigGenerated = false }
    }
}
