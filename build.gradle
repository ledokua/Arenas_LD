plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.144' apply false
}

subprojects {
    apply plugin: 'java'

    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        mavenCentral()
        mavenLocal() // VectorLib (published via its publishToMavenLocal)
        maven { name = 'Puffish'; url = 'https://maven.puffish.net' }
    }

    def targetJavaVersion = 21
    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release.set(targetJavaVersion)
        it.options.compilerArgs += ['-Xmaxerrs', '5000']
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
        withSourcesJar()
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
