# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Minecraft
minecraft_version=1.21.1
enabled_platforms=fabric,neoforge

# Mod Properties
mod_version = 4.1.2
maven_group = net.ledok
archives_base_name = arenas_ld

# Fabric
loader_version=0.18.4
# Pinned to the Fabric API version the Forgified Fabric API tracks, so common
# code can't use APIs that are missing on the NeoForge side.
fabric_version=0.115.6+1.21.1

# NeoForge
neoforge_version=21.1.235
# Forgified Fabric API (Sinytra) - implements fabric_version on NeoForge
ffapi_version=0.115.6+2.1.4+1.21.1

# Libraries
owo_version=0.12.15.4+1.21
owo_neoforge_version=0.12.15.1-beta.6+1.21
